name: Public Android Runner Availability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-android-runner-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Confirm the public runner can start
        shell: bash
        run: |
          set -euo pipefail
          echo "Public GitHub runner started"
          java -version
          javac -version
          echo "No TMC source, keys or release artifacts used"
