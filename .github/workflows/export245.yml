name: Export TMC Build 245 ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export245.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: export-tmc-build245
  cancel-in-progress: true
jobs:
  export:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUILD_BROKER_URL: https://nyuqtsumryimknijffoc.supabase.co/functions/v1/tmc-owner-build-245
    steps:
      - name: Download exact staged APK
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=owner-release-build" | python -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          curl -fsS --max-time 120 -H "Authorization: Bearer $TOKEN" "$BUILD_BROKER_URL?kind=release&target=android" -o TMC-Talent-Intelligence-build245.apk
          test "$(stat -c%s TMC-Talent-Intelligence-build245.apk)" = '9522753'
          echo '404ee23423a30058f6840320443b1f1018fd583ff577bd74098674ea2b8c1c6c  TMC-Talent-Intelligence-build245.apk' | sha256sum -c -
      - name: Package ZIP
        run: |
          printf '%s  %s\n' '404ee23423a30058f6840320443b1f1018fd583ff577bd74098674ea2b8c1c6c' 'TMC-Talent-Intelligence-build245.apk' > SHA256.txt
          zip -0 -q TMC-Talent-Intelligence-build245.zip TMC-Talent-Intelligence-build245.apk SHA256.txt
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TMC-Talent-Intelligence-build245
          path: TMC-Talent-Intelligence-build245.zip
          retention-days: 1
          if-no-files-found: error
