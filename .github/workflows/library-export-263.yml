name: Library Export 263
on:
  push:
    branches: [main]
    paths: ['.library-export-263-trigger']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  export:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export exact verified Build 263
        env:
          EXPORT_URL: https://nyuqtsumryimknijffoc.supabase.co/functions/v1/tmc-build180-material-proxy?export=263
          EXPECTED_SHA: e9b45279eaf8ddc9eddbfe7a70babf8b0b44707e42671dd675c42a3d46aa0ac7
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tmc-library-export-263" | python -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$TOKEN"
          curl -fsS --max-time 120 -H "Authorization: Bearer $TOKEN" "$EXPORT_URL" -o TMC-Talent-Intelligence-build263.apk
          echo "$EXPECTED_SHA  TMC-Talent-Intelligence-build263.apk" | sha256sum -c -
          test "$(stat -c%s TMC-Talent-Intelligence-build263.apk)" = "9563935"
      - name: Upload exact APK
        uses: actions/upload-artifact@v4
        with:
          name: TMC-Talent-Intelligence-build263
          path: TMC-Talent-Intelligence-build263.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
