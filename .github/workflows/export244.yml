name: Export TMC Build 244 ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export244.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: export-tmc-build244
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact staged APK
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=owner-release-build" | python -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          curl -fsS --max-time 120 -H "Authorization: Bearer $TOKEN" 'https://nyuqtsumryimknijffoc.supabase.co/functions/v1/tmc-owner-build-244?kind=release&target=android' -o TMC-Talent-Intelligence-build244.apk
          test "$(stat -c%s TMC-Talent-Intelligence-build244.apk)" = '9522753'
          echo '29f780a2cb42e94dc3ba65b01158b7bae5a6554f253d06d7b303a0e65f421d4c  TMC-Talent-Intelligence-build244.apk' | sha256sum -c -
      - name: Package ZIP
        run: |
          printf '%s  %s\n' '29f780a2cb42e94dc3ba65b01158b7bae5a6554f253d06d7b303a0e65f421d4c' 'TMC-Talent-Intelligence-build244.apk' > SHA256.txt
          zip -0 -q TMC-Talent-Intelligence-build244.zip TMC-Talent-Intelligence-build244.apk SHA256.txt
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TMC-Talent-Intelligence-build244
          path: TMC-Talent-Intelligence-build244.zip
          retention-days: 1
          if-no-files-found: error
