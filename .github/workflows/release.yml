name: Owner Release Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.build247-trigger']
permissions:
  contents: read
  id-token: write
concurrency:
  group: owner-release-build
  cancel-in-progress: false
jobs:
  android:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BUILD_BROKER_URL: https://nyuqtsumryimknijffoc.supabase.co/functions/v1/tmc-owner-build-244
    steps:
      - name: Allow one-shot push authorization to settle
        if: github.event_name == 'push'
        run: sleep 30
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python runner_client.py fetch android
      - run: python runner_client.py phase android --name prepare
      - run: python runner_client.py phase android --name build
      - name: Enable Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android upgrade and journey checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          script: python runner_client.py phase android --name validate
      - run: python runner_client.py phase android --name stage
      - if: always()
        run: python runner_client.py phase android --name cleanup
  windows:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      BUILD_BROKER_URL: ${{ vars.BUILD_BROKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python runner_client.py fetch windows
      - run: python runner_client.py phase windows --name prepare
      - run: python runner_client.py phase windows --name build
      - run: python runner_client.py phase windows --name validate
      - run: python runner_client.py phase windows --name stage
      - if: always()
        run: python runner_client.py phase windows --name cleanup
