name: Owner Release Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: owner-release-build
  cancel-in-progress: false
jobs:
  android:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BUILD_BROKER_URL: ${{ vars.BUILD_BROKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python runner_client.py fetch android
      - run: python runner_client.py phase android --name prepare
      - run: python runner_client.py phase android --name build
      - name: Enable Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android upgrade and journey checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          script: python runner_client.py phase android --name validate
      - run: python runner_client.py phase android --name stage
      - if: always()
        run: python runner_client.py phase android --name cleanup
